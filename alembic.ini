[alembic]
script_location = backend/app/alembic

[loggers]
keys = root, alembic, sqlalchemy

[handlers]
keys = consoleHandler

[formatters]
keys = simpleFormatter

[logger_root]
level = INFO
handlers = consoleHandler

[logger_alembic]
level = INFO
handlers = consoleHandler
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers = consoleHandler
qualname = sqlalchemy

[handler_consoleHandler]
class = StreamHandler
level = NOTSET
formatter = simpleFormatter
args = (sys.stdout,)

[formatter_simpleFormatter]
format = %(levelname)-8s [%(name)s] %(message)s