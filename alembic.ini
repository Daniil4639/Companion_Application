[alembic]
script_location = %(here)s/backend/app/alembic
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root, alembic, sqlalchemy

[handlers]
keys = consoleHandler

[formatters]
keys = simpleFormatter

[logger_root]
level = INFO
handlers = consoleHandler

[logger_alembic]
level = INFO
handlers = consoleHandler
qualname = alembic
propagate = 0

[logger_sqlalchemy]
level = WARN
handlers = consoleHandler
qualname = sqlalchemy
propagate = 0

[handler_consoleHandler]
class = StreamHandler
level = NOTSET
formatter = simpleFormatter
args = (sys.stdout,)

[formatter_simpleFormatter]
format = %(levelname)-8s [%(name)s] %(message)s